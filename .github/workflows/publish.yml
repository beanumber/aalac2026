name: Publish Quarto Website and Manuscript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          upgrade: 'TRUE'
          packages:
            any::remotes
            any::emoji
            any::fontawesome
            any::htmltools
            any::knitr
            any::lubridate
            any::rmarkdown

      - name: Render website
        run: quarto render

      - name: Render manuscript
        run: quarto render manuscript

      - name: Place manuscript output under website root
        run: |
          mkdir -p _site/manuscript
          cp -a manuscript/_site/. _site/manuscript/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false
          enable_jekyll: false